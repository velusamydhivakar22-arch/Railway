# Payanam Junction — RailConnect Production Properties
server.port=${SERVER_PORT:8080}

# MySQL Database DataSource
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:payanam_junction}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:railconnect}
spring.datasource.password=${DB_PASSWORD:railconnect_pass_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate in Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Security & JWT Secrets
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.payanam.railconnect=INFO
logging.level.org.springframework.web=WARN
